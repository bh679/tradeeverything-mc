# Gradle / JVM
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
# Off: Architectury Transformer races when several MC versions transform at once.
org.gradle.parallel=false
org.gradle.caching=true

# Mod — shared by every Minecraft version / loader.
# Per-version dependency numbers live in versions/<mc>/gradle.properties.
mod_id=tradeeverything
mod_name=Trade Everything
mod_license=PolyForm Shield 1.0.0
mod_version=0.16.0
mod_group_id=games.brennan.tradeeverything
mod_authors=Brennan Hatton
mod_description=Gives every villager an extra Trade Anything slot that accepts any item and exchanges it for goods the villager buys, at configurable rarity-based values.

# The Minecraft version whose jars keep the flat, suffix-free file name
# (tradeeverything-<loader>-<version>.jar) — Dungeon Train resolves the neoforge
# one by that exact name. Every other version gets a +mc<version> suffix.
primary_minecraft_version=1.21.1
